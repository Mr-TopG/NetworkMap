services:
  networkmap:
    build: .
    image: ghcr.io/mr-topg/networkmap:latest
    restart: unless-stopped
    environment:
      NETWORKMAP_TOKEN: "${NETWORKMAP_TOKEN:?Set NETWORKMAP_TOKEN to a long random value}"
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - networkmap-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  networkmap-data:
